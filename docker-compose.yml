services:

  #------------------#
  #  MYSQL DATABASE
  #------------------#
  mysql:
    image: mysql:latest
    container_name: mysql_container
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Test@123
      MYSQL_DATABASE: expenses_tracker
    volumes:
      - ./mysql-database:/var/lib/mysql  # Bind mount 
    networks:
      - expenses-app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-pTest@123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  #---------------------------#
  #  Spring Boot application
  #---------------------------#
  java-app:
    build: .
    image: expenses-tracker
    container_name: expensesapp-container
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/expenses_tracker
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Test@123
    networks:
      - expenses-app-network
    depends_on:
      - mysql
    restart: unless-stopped


# Network for communication between containers
networks:
  expenses-app-network:
